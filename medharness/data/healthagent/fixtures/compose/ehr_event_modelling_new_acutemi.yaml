    env_file:
    - path: ${SAMPLE_METADATA_HAB_ROOT}/.env
      required: false
    volumes:
    - ${SAMPLE_METADATA_HAB_ROOT}/assets/ehr_event_modelling/assets:/data/_cache:rw
    - workspace-data:/workspace/data:rw
    - ${SAMPLE_METADATA_TASK_DIR}/tests:/tests:rw
    - ${SAMPLE_METADATA_TASK_DIR}/environment/bootstrap.sh:/bootstrap.sh:ro
    - ${SAMPLE_METADATA_TASK_DIR}/environment/stage_data.py:/opt/ehr_event_modelling/stage_data.py:ro
    command:
    - /bin/bash
    - /bootstrap.sh
    x-local: true
