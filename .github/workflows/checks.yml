name: Check installation and runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install the tested dependencies and package
        run: |
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Run local runtime tests
        run: python -m pytest -q
      - name: Bootstrap the pinned backend
        run: medicalharness bootstrap
      - name: Exercise the complete synthetic execution path
        run: medicalharness smoke --output runs/ci-smoke
