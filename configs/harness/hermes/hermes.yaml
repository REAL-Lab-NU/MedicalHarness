# Hermes Agent runtime profile. The adapter routes provider requests through
# the usage proxy and launches a one-shot session in the episode workspace.

model:
  base_url: http://127.0.0.1:__VLLM_PORT__/v1
  default: qwen36-35b-a3b-260k
  provider: custom:vllm

providers:
  vllm:
    api_key: not-needed
    base_url: http://127.0.0.1:__VLLM_PORT__/v1
    context_length: 262144
    default_model: qwen36-35b-a3b-260k
    models:
    - qwen36-35b-a3b-260k
    name: Local vLLM
    # Provider request timeout in seconds.
    request_timeout_seconds: 1800

agent:
  # Maximum turns per episode.
  max_turns: 500
  reasoning_effort: medium
  verbose: false

terminal:
  backend: local
  cwd: .
  timeout: 180

code_execution:
  max_tool_calls: 50
  timeout: 300

tool_loop_guardrails:
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true

# Native browser extension settings.
browser:
  extension_control:
    enabled: false
  inactivity_timeout: 120

streaming:
  enabled: false

telemetry:
  shared_metrics:
    enabled: false
    send: false
